<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Networking Conversation Starter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #eef4ff 0%, #d6e6ff 100%);
    font-family: system-ui, sans-serif; color: #1a2b4a; display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 540px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #2a5cad; font-weight: 800; text-align: center; }
  .subtitle { color: #4a5b7c; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 24px rgba(42,92,173,0.12); }
  label { display: block; font-size: 0.85rem; color: #4a5b7c; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #b7cff7;
    font-family: inherit; font-size: 1rem; margin-bottom: 16px;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #2a5cad; color: #fff; display: block; margin: 0 auto;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #4a5b7c; min-height: 1.2em; text-align: center; }
  .result-box ul { list-style: none; margin: 20px 0 0; padding: 0; }
  .result-box li {
    padding: 12px 16px; background: #f0f6ff; border-radius: 10px; border: 1px solid #d6e6ff;
    margin-bottom: 10px; line-height: 1.4;
  }
  .footer-note { color: #4a5b7c; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #cdd9f7;
    border-top-color: #2a5cad; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🤝 Networking Conversation Starter</h1>
    <p class="subtitle">Event type + your field, get professional conversation starters. 100% on-device.</p>

    <div class="card">
      <label for="eventInput">Event type</label>
      <input type="text" id="eventInput" placeholder="e.g. alumni mixer, industry conference" />
      <label for="roleInput">Your role or field</label>
      <input type="text" id="roleInput" placeholder="e.g. software engineer, marketing lead" />
      <button class="action" id="generateBtn">Get Conversation Starters</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const eventInput = document.getElementById('eventInput');
    const roleInput = document.getElementById('roleInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const eventType = eventInput.value.trim();
      const roleField = roleInput.value.trim();
      if (!eventType || !roleField) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Coming up with openers...';

      try {
        const res = await fetch('/api/starters', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ eventType, roleField }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<ul>${data.starters.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
